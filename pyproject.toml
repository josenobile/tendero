[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tendero"
version = "0.1.0"
description = "WebMCP tools for a Colombian sale: DIAN identity, IVA, freight, retracto and payment rails."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jose Nobile" }]
keywords = ["webmcp", "colombia", "dian", "iva", "ecommerce", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11", "ruff>=0.6", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/josenobile/webmcp-tendero"
Repository = "https://github.com/josenobile/webmcp-tendero"

[tool.hatch.build.targets.wheel]
packages = ["src/tendero"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["tendero"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
disallow_any_explicit = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "ERA", "PL", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["tendero"]

[tool.ruff.lint.pylint]
max-args = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913"]

[tool.ruff.format]
quote-style = "double"
